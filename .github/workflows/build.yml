name: build-and-push

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # ~28 GB image (17.3 GB of weights) → BuildKit needs ~55 GB peak (snapshots + compressed blobs for the push).
      # Merge the runner's spare /mnt disk into the docker data root before anything else touches it.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /var/lib/docker
      - name: Restart docker on the enlarged data root
        run: sudo systemctl restart docker && df -h / /var/lib/docker

      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: name
        run: |
          echo "image=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT";
          else echo "tag=dev-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
            ${{ github.ref_type == 'tag' && format('{0}:latest', steps.name.outputs.image) || '' }}
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:latest
          cache-to: type=inline

      - name: Extract lock file and model manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          provenance: false
          sbom: false
          outputs: type=local,dest=./out

      - name: Verify pushed image and write summary
        run: |
          set -euo pipefail
          IMG="${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}' > manifest.json
          LAYERS=$(python3 -c "import json;print(len(json.load(open('manifest.json'))['layers']))")
          echo "layers: $LAYERS"; test "$LAYERS" -ge 8
          BIG=$(python3 -c "import json;print(max(l['size'] for l in json.load(open('manifest.json'))['layers']))")
          echo "largest layer bytes: $BIG"; test "$BIG" -lt 10000000000
          df -h / /var/lib/docker
          {
            echo "## Image"; echo '```'
            echo "${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "layers: $LAYERS, largest layer: $BIG bytes"; echo '```'
            echo "## Model manifest"; echo '```'; cat out/MANIFEST.json; echo '```'
            echo "## requirements.lock"; echo '```'; cat out/requirements.lock; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: image-artifacts-${{ steps.name.outputs.tag }}
          path: |
            out/
            manifest.json
