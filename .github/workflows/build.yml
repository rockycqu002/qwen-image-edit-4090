name: build-and-push

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # the image is ~28 GB (17.5 GB of weights); the stock runner has ~14 GB free, so reclaim what we can
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - run: df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: name
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:latest
          cache-to: type=inline

      - name: Extract lock file and model manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          outputs: type=local,dest=./out
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:latest

      - name: Summary
        run: |
          {
            echo "## Image"
            echo '```'
            echo "${{ steps.name.outputs.image }}:${{ github.ref_name }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "## Model manifest"; echo '```'; cat out/MANIFEST.json; echo '```'
            echo "## requirements.lock (head)"; echo '```'; head -60 out/requirements.lock; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: image-artifacts-${{ github.ref_name }}
          path: out/
